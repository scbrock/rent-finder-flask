<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toronto Rent Deals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }
    .container { max-width: 1200px; margin: 0 auto; padding: 16px; }
    header { background: #2d6a4f; color: white; padding: 20px 24px; border-radius: 8px; margin-bottom: 16px; }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { margin-top: 4px; opacity: 0.85; font-size: 0.85rem; }

    /* ── Filters ── */
    .filters { background: white; padding: 14px 16px; border-radius: 8px; margin-bottom: 14px;
               display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .filters .filter-group { display: flex; flex-direction: column; gap: 3px; }
    .filters label { font-size: 0.75rem; font-weight: 600; color: #555; }
    .filters select, .filters input[type="range"] {
      padding: 6px 8px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.85rem;
    }
    .filter-badge {
      background: #e74c3c; color: white; font-size: 0.7rem; font-weight: 700;
      padding: 1px 6px; border-radius: 10px; margin-left: 4px; vertical-align: middle;
      display: none;
    }
    .filter-badge.active { display: inline; }
    .toggle-btn {
      display: flex; align-items: center; gap: 6px; cursor: pointer;
      padding: 6px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.85rem;
      background: white; user-select: none;
    }
    .toggle-btn input { cursor: pointer; }
    .toggle-btn.active { background: #e8f5e9; border-color: #2d6a4f; color: #2d6a4f; }
    .price-range-wrap { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #555; }
    #price_min, #price_max { width: 80px; }
    #filter_apply {
      padding: 7px 16px; background: #2d6a4f; color: white; border: none;
      border-radius: 5px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
    }
    #filter_apply:hover { background: #1b4332; }
    #filter_reset {
      padding: 7px 12px; background: #ccc; color: #333; border: none;
      border-radius: 5px; cursor: pointer; font-size: 0.8rem;
    }
    #filter_reset:hover { background: #bbb; }

    /* ── Stats ── */
    .stats { display: flex; gap: 12px; margin-bottom: 14px; }
    .stat-card { background: white; padding: 12px 16px; border-radius: 8px; flex: 1; text-align: center; }
    .stat-card .value { font-size: 1.5rem; font-weight: 700; color: #2d6a4f; }
    .stat-card .label { font-size: 0.75rem; color: #666; margin-top: 3px; }

    /* ── Table ── */
    table { background: white; border-radius: 8px; overflow: hidden; width: 100%;
            border-collapse: collapse; }
    th { background: #52b788; color: white; padding: 10px 12px; text-align: left;
         font-size: 0.8rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    th:hover { background: #40916c; }
    td { padding: 9px 12px; font-size: 0.85rem; border-bottom: 1px solid #eee; }
    tr:hover { background: #f0faf4; }
    tr:last-child td { border-bottom: none; }

    .pct-good { color: #2d6a4f; font-weight: 700; }
    .pct-mid { color: #b56b00; }
    .pct-bad { color: #999; }

    /* ── Days-on-market badges (MC-254) ── */
    .age-badge {
      display: inline-block; padding: 1px 7px; border-radius: 8px;
      font-size: 0.72rem; font-weight: 700;
    }
    .age-fresh { background: #d4edda; color: #155724; }      /* green: <= 3d */
    .age-medium { background: #fff3cd; color: #856404; }     /* yellow: 4-14d */
    .age-stale { background: #f8d7da; color: #721c24; }     /* red: > 14d */
    .age-neutral { background: #eee; color: #555; }
    .stale-tag { background: #f8d7da; color: #721c24; padding: 1px 6px; border-radius: 8px;
                 font-size: 0.7rem; font-weight: 700; margin-left: 4px; }

    /* ── Cautions column (MC-255) ── */
    .cautions-cell { min-width: 160px; }
    .caution-chip {
      display: inline-block; background: #fff3cd; color: #856404;
      border: 1px solid #ffeeba; padding: 1px 6px; border-radius: 8px;
      font-size: 0.68rem; font-weight: 600; margin: 1px 2px;
    }
    .clean-badge {
      display: inline-block; background: #d4edda; color: #155724;
      padding: 1px 7px; border-radius: 8px; font-size: 0.7rem; font-weight: 700;
    }

    .parking-icon { color: #2d6a4f; font-size: 0.9rem; }
    .link-btn { display: inline-block; padding: 3px 9px; background: #40916c; color: white;
                border-radius: 4px; text-decoration: none; font-size: 0.75rem; font-weight: 600; }
    .link-btn:hover { background: #2d6a4f; }

    .no-deals { text-align: center; padding: 40px; color: #888; }
    .loading { text-align: center; padding: 30px; color: #888; }

    @media (max-width: 700px) {
      .filters { flex-direction: column; }
      table { font-size: 0.78rem; }
      th, td { padding: 7px 8px; }
      .stats { flex-direction: column; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏠 Toronto Rent Deals</h1>
    <p>Listings priced below market — scraped from Kijiji. Updated daily.</p>
  </header>

  <div class="filters">
    <!-- Beds -->
    <div class="filter-group">
      <label>Min Beds</label>
      <select id="beds_min">
        <option value="">Any</option>
        <option value="0">0 (Bachelor)</option>
        <option value="1">1 BR</option>
        <option value="2">2 BR</option>
        <option value="3">3 BR</option>
        <option value="4">4+ BR</option>
      </select>
    </div>

    <!-- Baths -->
    <div class="filter-group">
      <label>Min Baths</label>
      <select id="baths_min">
        <option value="">Any</option>
        <option value="1">1+</option>
        <option value="1.5">1.5+</option>
        <option value="2">2+</option>
      </select>
    </div>

    <!-- Price range -->
    <div class="filter-group">
      <label>Price Range ($)</label>
      <div class="price-range-wrap">
        <input id="price_min" type="number" placeholder="Min" min="0" step="50">
        <span>–</span>
        <input id="price_max" type="number" placeholder="Max" min="0" step="50">
      </div>
    </div>

    <!-- Parking -->
    <label class="toggle-btn" id="parking_toggle">
      <input type="checkbox" id="has_parking">
      <span>🚗 Parking</span>
    </label>

    <!-- Neighbourhood -->
    <div class="filter-group">
      <label>Neighbourhood</label>
      <input id="neighbourhood" type="text" placeholder="e.g. Queen West" style="width: 130px;">
    </div>

    <!-- Region -->
    <div class="filter-group">
      <label>Region</label>
      <select id="region">
        <option value="">All</option>
        <option value="Downtown">Downtown</option>
        <option value="East End">East End</option>
        <option value="West End">West End</option>
        <option value="North York">North York</option>
        <option value="Etobicoke">Etobicoke</option>
        <option value="Scarborough">Scarborough</option>
      </select>
    </div>

    <!-- Commute destination -->
    <div class="filter-group">
      <label>Commute Destination</label>
      <input id="commute_dest" type="text" placeholder="e.g. Union Station" style="width:150px;" title="Destination address for commute filter">
    </div>

    <!-- Max commute -->
    <div class="filter-group">
      <label>Max Commute (min)</label>
      <input id="max_commute" type="number" placeholder="e.g. 30" min="1" max="180" style="width:80px;">
    </div>

    <!-- Sort -->
    <div class="filter-group">
      <label>Sort By</label>
      <select id="sort_by">
        <option value="score">Best Score</option>
        <option value="pct">% Under Market</option>
        <option value="price">Lowest Price</option>
        <option value="beds">Most Beds</option>
        <option value="days_ago">Freshest</option>
      </select>
    </div>

    <!-- Hide stale toggle (MC-252) -->
    <label class="toggle-btn" id="hide_stale_toggle">
      <input type="checkbox" id="hide_stale">
      <span>🚫 Hide Stale (&gt;30d)</span>
    </label>

    <div style="display:flex;gap:6px;align-items:flex-end;">
      <button id="filter_apply" onclick="loadDeals()">Filter</button>
      <button id="filter_reset" onclick="resetFilters()">Reset</button>
      <span id="filter_count" class="filter-badge">0</span>
    </div>
  </div>

  <!-- Stats bar -->
  <div class="stats" id="stats">
    <div class="stat-card"><div class="value" id="total_count">—</div><div class="label">Deals Found</div></div>
    <div class="stat-card"><div class="value" id="avg_under">—</div><div class="label">Avg % Under</div></div>
    <div class="stat-card"><div class="value" id="best_deal">—</div><div class="label">Best Deal</div></div>
  </div>

  <div id="loading" class="loading">Loading deals…</div>
  <div id="no_deals" class="no-deals" style="display:none">No deals match your filters.</div>
  <table id="deals_table" style="display:none">
    <thead>
      <tr>
        <th onclick="sortTable('score')">#</th>
        <th onclick="sortTable('neighbourhood')">Neighbourhood</th>
        <th onclick="sortTable('region')">Region</th>
        <th onclick="sortTable('beds')">BD</th>
        <th onclick="sortTable('baths')">BA</th>
        <th onclick="sortTable('price')">Price</th>
        <th onclick="sortTable('fair')">Fair</th>
        <th onclick="sortTable('pct')">% Under</th>
        <th onclick="sortTable('commute')" title="Walking commute time">↳ Min</th>
        <th onclick="sortTable('days_ago')">Age</th>
        <th class="cautions-cell">Cautions</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody id="deals_body"></tbody>
  </table>
</div>

<script>
let allDeals = [];
let currentSort = 'score';
let lastCommuteDest = null;   // Track last computed destination
let commuteTimesCache = {};   // neighbourhood → {commute_minutes, walk_dist_km, source}

// Parse URL params on load
function parseQueryParams() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('beds_min')) document.getElementById('beds_min').value = params.get('beds_min');
  if (params.get('baths_min')) document.getElementById('baths_min').value = params.get('baths_min');
  if (params.get('price_min')) document.getElementById('price_min').value = params.get('price_min');
  if (params.get('price_max')) document.getElementById('price_max').value = params.get('price_max');
  if (params.get('has_parking')) {
    document.getElementById('has_parking').checked = true;
    document.getElementById('parking_toggle').classList.add('active');
  }
  if (params.get('neighbourhood')) document.getElementById('neighbourhood').value = params.get('neighbourhood');
  if (params.get('region')) document.getElementById('region').value = params.get('region');
  if (params.get('sort')) {
    document.getElementById('sort_by').value = params.get('sort');
    currentSort = params.get('sort');
  }
  if (params.get('commute_dest')) document.getElementById('commute_dest').value = params.get('commute_dest');
  if (params.get('max_commute')) document.getElementById('max_commute').value = params.get('max_commute');
  if (params.get('hide_stale') === 'true') {
    document.getElementById('hide_stale').checked = true;
    document.getElementById('hide_stale_toggle').classList.add('active');
  }
  updateFilterCount();
}

function buildParams() {
  const params = new URLSearchParams();
  const bedsMin = document.getElementById('beds_min').value;
  const bathsMin = document.getElementById('baths_min').value;
  const priceMin = document.getElementById('price_min').value;
  const priceMax = document.getElementById('price_max').value;
  const hasParking = document.getElementById('has_parking').checked;
  const neighbourhood = document.getElementById('neighbourhood').value.trim();
  const region = document.getElementById('region').value;
  const sortBy = document.getElementById('sort_by').value;
  const hideStale = document.getElementById('hide_stale').checked;

  if (bedsMin) params.set('beds_min', bedsMin);
  if (bathsMin) params.set('baths_min', bathsMin);
  if (priceMin) params.set('price_min', priceMin);
  if (priceMax) params.set('price_max', priceMax);
  if (hasParking) params.set('has_parking', 'true');
  if (neighbourhood) params.set('neighbourhood', neighbourhood);
  if (region) params.set('region', region);
  if (sortBy !== 'score') params.set('sort', sortBy);
  if (hideStale) params.set('hide_stale', 'true');

  const commuteDest = document.getElementById('commute_dest').value.trim();
  const maxCommute = document.getElementById('max_commute').value;
  if (commuteDest) params.set('commute_dest', commuteDest);
  if (maxCommute) params.set('max_commute', maxCommute);

  return params;
}

function updateFilterCount() {
  let count = 0;
  if (document.getElementById('beds_min').value) count++;
  if (document.getElementById('baths_min').value) count++;
  if (document.getElementById('price_min').value) count++;
  if (document.getElementById('price_max').value) count++;
  if (document.getElementById('has_parking').checked) count++;
  if (document.getElementById('neighbourhood').value.trim()) count++;
  if (document.getElementById('region').value) count++;
  if (document.getElementById('hide_stale').checked) count++;
  if (document.getElementById('commute_dest').value.trim()) count++;
  if (document.getElementById('max_commute').value) count++;
  const badge = document.getElementById('filter_count');
  if (count > 0) {
    badge.textContent = count;
    badge.classList.add('active');
  } else {
    badge.classList.remove('active');
  }
}

function resetFilters() {
  document.getElementById('beds_min').selectedIndex = 0;
  document.getElementById('baths_min').selectedIndex = 0;
  document.getElementById('price_min').value = '';
  document.getElementById('price_max').value = '';
  document.getElementById('has_parking').checked = false;
  document.getElementById('parking_toggle').classList.remove('active');
  document.getElementById('neighbourhood').value = '';
  document.getElementById('region').selectedIndex = 0;
  document.getElementById('sort_by').selectedIndex = 0;
  document.getElementById('hide_stale').checked = false;
  document.getElementById('hide_stale_toggle').classList.remove('active');
  document.getElementById('commute_dest').value = '';
  document.getElementById('max_commute').value = '';
  lastCommuteDest = null;
  commuteTimesCache = {};
  loadDeals();
  history.replaceState({}, '', window.location.pathname);
  updateFilterCount();
}

async function loadDeals() {
  const params = buildParams();
  updateFilterCount();

  // Update URL (no reload)
  const newUrl = params.toString() ? '?' + params.toString() : window.location.pathname;
  history.replaceState({}, '', newUrl);

  document.getElementById('loading').style.display = 'block';
  document.getElementById('no_deals').style.display = 'none';
  document.getElementById('deals_table').style.display = 'none';

  try {
    const res = await fetch('/api/deals?' + params.toString());
    allDeals = await res.json();

    // MC-257: If commute destination is set, fetch live commute times
    const commuteDest = document.getElementById('commute_dest').value.trim();
    if (commuteDest) {
      // Re-compute only if destination changed
      if (commuteDest !== lastCommuteDest) {
        lastCommuteDest = commuteDest;
        try {
          const cr = await fetch('/api/commute', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({destination: commuteDest})
          });
          if (cr.ok) {
            const cdata = await cr.json();
            if (cdata.times) {
              commuteTimesCache = cdata.times;
            }
          }
        } catch(e) {
          console.warn('Commute API unavailable:', e.message);
        }
      }

      // Merge computed commute times into deal data
      if (Object.keys(commuteTimesCache).length > 0) {
        allDeals = allDeals.map(d => {
          const entry = commuteTimesCache[d.neighbourhood || ''];
          if (entry && entry.commute_minutes != null) {
            return {...d, commute_minutes: entry.commute_minutes};
          }
          return d;
        });

        // Apply max_commute filter against live times
        const maxCommute = parseInt(document.getElementById('max_commute').value) || null;
        if (maxCommute !== null) {
          allDeals = allDeals.filter(d =>
            d.commute_minutes == null || d.commute_minutes <= maxCommute
          );
          // Re-sort by commute when that filter is active
          const sortBy = document.getElementById('sort_by').value;
          if (sortBy === 'commute') {
            allDeals.sort((a, b) => (a.commute_minutes || 999) - (b.commute_minutes || 999));
          }
        }
      }
    } else {
      // Reset cache if destination cleared
      lastCommuteDest = null;
      commuteTimesCache = {};
    }

    renderDeals(allDeals);
  } catch(e) {
    document.getElementById('loading').textContent = 'Error: ' + e.message;
  }
}

function pctClass(pct) {
  if (pct === '—') return '';
  const n = parseFloat(pct);
  if (n >= 15) return 'pct-good';
  if (n >= 8) return 'pct-mid';
  return 'pct-bad';
}

function renderDeals(deals) {
  document.getElementById('loading').style.display = 'none';
  if (!deals || deals.length === 0) {
    document.getElementById('no_deals').style.display = 'block';
    document.getElementById('total_count').textContent = '0';
    document.getElementById('avg_under').textContent = '—';
    document.getElementById('best_deal').textContent = '—';
    return;
  }

  document.getElementById('total_count').textContent = deals.length;
  const pcts = deals.map(d => parseFloat(d.pct_under)).filter(n => !isNaN(n));
  const avg = pcts.length ? (pcts.reduce((a,b)=>a+b,0)/pcts.length).toFixed(1) : '—';
  document.getElementById('avg_under').textContent = avg !== '—' ? avg + '%' : '—';
  const best = deals[0];
  document.getElementById('best_deal').textContent = best ? best.pct_under_fmt : '—';

  const tbody = document.getElementById('deals_body');
  tbody.innerHTML = '';
  deals.forEach((d, i) => {
    const pct = d.pct_under_fmt || '—';
    const pctCls = pctClass(pct);
    const link = d.link || '#';
    const beds = d.beds !== undefined && d.beds !== null ? d.beds : '—';
    const baths = d.baths !== undefined && d.baths !== null ? d.baths : '—';
    const commute = d.commute_minutes !== undefined && d.commute_minutes !== null && d.commute_minutes !== '' ? d.commute_minutes + ' min' : '—';
    const parkingIcon = d.has_parking ? '<span class="parking-icon" title="Parking">🚗</span>' : '';

    // MC-254: days_ago badge with colour coding
    const daysAgo = d.days_ago;
    const daysAgoClass = d.days_ago_class || 'age-neutral';
    const daysAgoStr = d.days_ago_str || (daysAgo !== null && daysAgo !== undefined ? daysAgo + 'd' : '—');

    // MC-252: May be stale warning badge (>30 days)
    const staleTag = (d.is_stale === true || d.is_stale === 'true') ? '<span class="stale-tag">⚠️ Stale</span>' : '';

    // MC-255: Cautions column
    const cautions = d.cautions || [];
    let cautionsHtml = '';
    if (cautions.length > 0) {
      cautionsHtml = cautions.map(c => `<span class="caution-chip">${c}</span>`).join('');
    } else {
      cautionsHtml = '<span class="clean-badge">✓ Clean</span>';
    }

    const row = `<tr>
      <td>${i + 1}</td>
      <td><strong>${d.neighbourhood || '—'}</strong> ${parkingIcon} ${staleTag}</td>
      <td>${d.region || '—'}</td>
      <td>${beds}</td>
      <td>${baths}</td>
      <td>${d.price_fmt || '—'}</td>
      <td>${d.fair_value_fmt || '—'}</td>
      <td class="${pctCls}"><strong>${pct}</strong></td>
      <td>${commute}</td>
      <td><span class="age-badge ${daysAgoClass}">${daysAgoStr}</span></td>
      <td>${cautionsHtml}</td>
      <td><a href="${link}" target="_blank" class="link-btn">View</a></td>
    </tr>`;
    tbody.insertRow(-1).innerHTML = row;
  });

  document.getElementById('deals_table').style.display = 'table';
}

// Parking toggle styling
document.getElementById('has_parking').addEventListener('change', function() {
  document.getElementById('parking_toggle').classList.toggle('active', this.checked);
  updateFilterCount();
});

// Hide stale toggle styling
document.getElementById('hide_stale').addEventListener('change', function() {
  document.getElementById('hide_stale_toggle').classList.toggle('active', this.checked);
  updateFilterCount();
});

// Wire up all inputs to update filter count on change
['beds_min', 'baths_min', 'price_min', 'price_max', 'neighbourhood', 'region'].forEach(function(id) {
  const el = document.getElementById(id);
  if (el) el.addEventListener('change', updateFilterCount);
});

// Init
parseQueryParams();
loadDeals();
</script>
</body>
</html>
