<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Toronto Rent Deals</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; color: #222; }
    .container { max-width: 1100px; margin: 0 auto; padding: 20px; }
    header { background: #2d6a4f; color: white; padding: 24px; border-radius: 8px; margin-bottom: 20px; }
    header h1 { font-size: 1.6rem; font-weight: 700; }
    header p { margin-top: 6px; opacity: 0.85; font-size: 0.9rem; }

    .filters { background: white; padding: 16px; border-radius: 8px; margin-bottom: 16px;
               display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
    .filters label { font-weight: 600; font-size: 0.85rem; }
    .filters select, .filters input { padding: 7px 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 0.9rem; }
    .filters button { padding: 8px 16px; background: #2d6a4f; color: white; border: none;
                      border-radius: 5px; cursor: pointer; font-weight: 600; }
    .filters button:hover { background: #1b4332; }

    .stats { display: flex; gap: 16px; margin-bottom: 16px; }
    .stat-card { background: white; padding: 14px 18px; border-radius: 8px; flex: 1; text-align: center; }
    .stat-card .value { font-size: 1.8rem; font-weight: 700; color: #2d6a4f; }
    .stat-card .label { font-size: 0.8rem; color: #666; margin-top: 4px; }

    table { background: white; border-radius: 8px; overflow: hidden; width: 100%; border-collapse: collapse; }
    th { background: #52b788; color: white; padding: 12px 14px; text-align: left; font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    th:hover { background: #40916c; }
    td { padding: 11px 14px; font-size: 0.9rem; border-bottom: 1px solid #eee; }
    tr:hover { background: #f0faf4; }
    tr:last-child td { border-bottom: none; }

    .deal-badge { background: #d4edda; color: #155724; padding: 2px 8px; border-radius: 12px;
                  font-size: 0.75rem; font-weight: 700; }
    .pct-good { color: #2d6a4f; font-weight: 700; }
    .pct-mid { color: #b56b00; }
    .pct-bad { color: #999; }
    .link-btn { display: inline-block; padding: 4px 10px; background: #40916c; color: white;
                border-radius: 4px; text-decoration: none; font-size: 0.8rem; font-weight: 600; }
    .link-btn:hover { background: #2d6a4f; }

    .no-deals { text-align: center; padding: 40px; color: #888; }
    .loading { text-align: center; padding: 30px; color: #888; }

    @media (max-width: 600px) {
      .filters { flex-direction: column; }
      table { font-size: 0.8rem; }
      th, td { padding: 8px 10px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <h1>🏠 Toronto Rent Deals</h1>
    <p>Listings priced below market — scraped daily from Kijiji. Updated 7 AM ET.</p>
  </header>

  <div class="filters">
    <label>Min Beds:</label>
    <select id="min_beds">
      <option value="">Any</option>
      <option value="0">0 (Bachelor)</option>
      <option value="1">1 BR</option>
      <option value="2">2 BR</option>
      <option value="3">3+ BR</option>
    </select>

    <label>Max Price:</label>
    <select id="max_price">
      <option value="">Any</option>
      <option value="2000">$2,000</option>
      <option value="2500">$2,500</option>
      <option value="3000">$3,000</option>
    </select>

    <label>Neighbourhood:</label>
    <input id="neighbourhood" type="text" placeholder="e.g. Queen West" style="width: 140px;">

    <label>Sort:</label>
    <select id="sort_by">
      <option value="score">Best Score</option>
      <option value="pct">% Under Market</option>
      <option value="price">Lowest Price</option>
    </select>

    <button onclick="loadDeals()">Filter</button>
  </div>

  <div class="stats" id="stats">
    <div class="stat-card"><div class="value" id="total_count">—</div><div class="label">Total Deals</div></div>
    <div class="stat-card"><div class="value" id="avg_under">—</div><div class="label">Avg % Under Market</div></div>
    <div class="stat-card"><div class="value" id="best_deal">—</div><div class="label">Best Deal</div></div>
  </div>

  <div id="loading" class="loading">Loading deals…</div>
  <div id="no_deals" class="no-deals" style="display:none">No deals match your filters.</div>
  <table id="deals_table" style="display:none">
    <thead>
      <tr>
        <th onclick="sortTable('rank')">#</th>
        <th onclick="sortTable('Neighbourhood')">Neighbourhood</th>
        <th onclick="sortTable('Beds')">Beds</th>
        <th onclick="sortTable('Price')">Price</th>
        <th onclick="sortTable('Fair Value')">Fair Value</th>
        <th onclick="sortTable('pct_under')">% Under</th>
        <th onclick="sortTable('Days Old')">Days Old</th>
        <th>Link</th>
      </tr>
    </thead>
    <tbody id="deals_body"></tbody>
  </table>
</div>

<script>
let allDeals = [];

async function loadDeals() {
  const minBeds = document.getElementById('min_beds').value;
  const maxPrice = document.getElementById('max_price').value;
  const neighbourhood = document.getElementById('neighbourhood').value.trim();
  const sortBy = document.getElementById('sort_by').value;

  const params = new URLSearchParams();
  if (minBeds) params.set('min_beds', minBeds);
  if (maxPrice) params.set('max_price', maxPrice);
  if (neighbourhood) params.set('neighbourhood', neighbourhood);
  params.set('sort', sortBy);

  document.getElementById('loading').style.display = 'block';
  document.getElementById('no_deals').style.display = 'none';
  document.getElementById('deals_table').style.display = 'none';

  try {
    const res = await fetch('/api/deals?' + params.toString());
    allDeals = await res.json();

    renderDeals(allDeals);
  } catch(e) {
    document.getElementById('loading').textContent = 'Error loading deals: ' + e.message;
  }
}

function pctClass(pct) {
  if (pct === '—') return '';
  const n = parseFloat(pct);
  if (n >= 15) return 'pct-good';
  if (n >= 8) return 'pct-mid';
  return 'pct-bad';
}

function renderDeals(deals) {
  document.getElementById('loading').style.display = 'none';
  if (!deals || deals.length === 0) {
    document.getElementById('no_deals').style.display = 'block';
    document.getElementById('total_count').textContent = '0';
    document.getElementById('avg_under').textContent = '—';
    document.getElementById('best_deal').textContent = '—';
    return;
  }

  // Stats
  document.getElementById('total_count').textContent = deals.length;
  const pcts = deals.map(d => parseFloat(d['% Under'])).filter(n => !isNaN(n));
  const avg = pcts.length ? (pcts.reduce((a,b)=>a+b,0)/pcts.length).toFixed(1) : '—';
  document.getElementById('avg_under').textContent = avg !== '—' ? avg + '%' : '—';
  document.getElementById('best_deal').textContent = deals[0] ? deals[0]['% Under'] : '—';

  const tbody = document.getElementById('deals_body');
  tbody.innerHTML = '';
  deals.forEach((d, i) => {
    const pct = d['% Under'] || '—';
    const pctCls = pctClass(pct);
    const link = d['Link'] || '#';
    const beds = d['Beds'] !== undefined && d['Beds'] !== null ? d['Beds'] : '—';
    const days = d['Days Old'] !== undefined && d['Days Old'] !== null ? d['Days Old'] : '—';
    const sqft = d['Sqft'] && d['Sqft'] !== 'nan' ? d['Sqft'] : '—';
    const rank = d['rank'] || i + 1;

    const row = `<tr>
      <td>${rank}</td>
      <td><strong>${d['Neighbourhood'] || '—'}</strong></td>
      <td>${beds}</td>
      <td>${d['Price'] || '—'}</td>
      <td>${d['Fair Value'] || '—'}</td>
      <td class="${pctCls}"><strong>${pct}</strong></td>
      <td>${days}d</td>
      <td><a href="${link}" target="_blank" class="link-btn">View</a></td>
    </tr>`;
    tbody.insertRow(-1).innerHTML = row;
  });

  document.getElementById('deals_table').style.display = 'table';
}

function sortTable(col) {
  // Simple sort by clicking headers
}

// Load on page open
loadDeals();
</script>
</body>
</html>
